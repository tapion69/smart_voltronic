name: "Smart Voltronic ESP32 S3 TEST"
version: "1.1.7"
slug: "smart_voltronic_esp32_test"
description: "Banc de test ESP32 S3 / HA - installation separee, MQTT attention aux doublons"

arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386

startup: services
boot: auto
init: false
uart: true

ports:
  1892/tcp: 1895

panel_icon: mdi:solar-power

options:
  # ============================================================
  # ⚡ ONDULEUR 1
  # ============================================================
  inv1_link: "serial"
  inv1_serial_port: "/dev/serial/by-id/CHANGE-ME-1"
  inv1_gateway_host: ""
  inv1_gateway_port: 8899
  inv1_esp_host: ""
  inv1_esp_port: 18081
  inv1_esp_code: ""
  inv1_esp_write_enabled: false
  inv1_display_mode: "modern"
  inv1_output_priority_2choices: false
  inv1_battery_capacity_ah: 0
  inv1_battery_total_capacity_kwh: 0

  # ============================================================
  # ⚡ ONDULEUR 2
  # ============================================================
  inv2_link: "disabled"
  inv2_serial_port: "/dev/serial/by-id/CHANGE-ME-2"
  inv2_gateway_host: ""
  inv2_gateway_port: 8899
  inv2_esp_host: ""
  inv2_esp_port: 18081
  inv2_esp_code: ""
  inv2_esp_write_enabled: false
  inv2_display_mode: "modern"
  inv2_output_priority_2choices: false
  inv2_battery_capacity_ah: 0
  inv2_battery_total_capacity_kwh: 0

  # ============================================================
  # ⚡ ONDULEUR 3
  # ============================================================
  inv3_link: "disabled"
  inv3_serial_port: "/dev/serial/by-id/CHANGE-ME-3"
  inv3_gateway_host: ""
  inv3_gateway_port: 8899
  inv3_esp_host: ""
  inv3_esp_port: 18081
  inv3_esp_code: ""
  inv3_esp_write_enabled: false
  inv3_display_mode: "modern"
  inv3_output_priority_2choices: false
  inv3_battery_capacity_ah: 0
  inv3_battery_total_capacity_kwh: 0

  # ============================================================
  # 🔋 BATTERY SYSTEM VOLTAGE
  # ============================================================
  battery_section: "────────── BATTERY ──────────"
  battery_system_voltage: "48V"

  # ============================================================
  # 📡 MQTT CONFIGURATION
  # ============================================================
  mqtt_section: "────────── MQTT CONFIGURATION ──────────"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""

  # ============================================================
  # 🔔 OPTIONS
  # ============================================================
  send_bip: true
  polling_fast: 5
  dashboard_language: "fr"
  dashboard_output: "both"
  dashboard_custom_cards_installed: false
  dashboard_diag_communication: false
  premium_key: ""

  # ============================================================
  # 🌍 TIMEZONE
  # ============================================================
  timezone_section: "────────── TIMEZONE ──────────"
  timezone_mode: "Europe/Paris"
  timezone_custom: "UTC"

schema:
  # Onduleur 1
  inv1_link: list(serial|gateway|esp32|disabled)
  inv1_serial_port: str?
  inv1_gateway_host: str?
  inv1_gateway_port: int?
  inv1_esp_host: str?
  inv1_esp_port: int?
  inv1_esp_code: password?
  inv1_esp_write_enabled: bool
  inv1_display_mode: list(modern|legacy_usb_sub_sbu)
  inv1_output_priority_2choices: bool
  inv1_battery_capacity_ah: float?
  inv1_battery_total_capacity_kwh: float?

  # Onduleur 2
  inv2_link: list(serial|gateway|esp32|disabled)
  inv2_serial_port: str?
  inv2_gateway_host: str?
  inv2_gateway_port: int?
  inv2_esp_host: str?
  inv2_esp_port: int?
  inv2_esp_code: password?
  inv2_esp_write_enabled: bool
  inv2_display_mode: list(modern|legacy_usb_sub_sbu)
  inv2_output_priority_2choices: bool
  inv2_battery_capacity_ah: float?
  inv2_battery_total_capacity_kwh: float?

  # Onduleur 3
  inv3_link: list(serial|gateway|esp32|disabled)
  inv3_serial_port: str?
  inv3_gateway_host: str?
  inv3_gateway_port: int?
  inv3_esp_host: str?
  inv3_esp_port: int?
  inv3_esp_code: password?
  inv3_esp_write_enabled: bool
  inv3_display_mode: list(modern|legacy_usb_sub_sbu)
  inv3_output_priority_2choices: bool
  inv3_battery_capacity_ah: float?
  inv3_battery_total_capacity_kwh: float?

  # Séparateur Battery
  battery_section: str?

  # Battery system voltage
  battery_system_voltage: list(24V|48V)

  # Séparateur MQTT
  mqtt_section: str?

  # MQTT
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_pass: password

  # Options
  send_bip: bool
  polling_fast: int?
  dashboard_language: list(fr|en)
  dashboard_output: list(lovelace|html|both|disabled)
  dashboard_custom_cards_installed: bool
  dashboard_diag_communication: bool
  premium_key: password?

  # Séparateur Timezone
  timezone_section: str?

  # Timezone
  timezone_mode: list(Europe/Paris|Europe/Berlin|Europe/Brussels|Europe/Madrid|Europe/Rome|Europe/London|America/New_York|America/Chicago|America/Los_Angeles|America/Montreal|Asia/Dubai|Asia/Tokyo|Australia/Sydney|CUSTOM)
  timezone_custom: str?
