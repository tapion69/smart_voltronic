name: ESP32 persistent write queue 1h / 5 - full regression
on:
  push:
    branches: [main]
    paths:
      - 'smart-voltronic/tests/integrate_esp_queue.py'
      - 'smart-voltronic/tests/test_esp_queue_full.cjs'
      - 'smart-voltronic/tests/test_esp_queue_runtime_route.cjs'
      - '.github/workflows/integrate_esp_queue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Test persistent queue, TTL, purge, verified learning, MQTT discovery
        run: |
          node smart-voltronic/tests/test_esp_queue_full.cjs
          node smart-voltronic/tests/test_esp_queue_runtime_route.cjs
      - name: Verify every Node-RED Function body compiles
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const a=JSON.parse(fs.readFileSync('smart-voltronic/flows.json','utf8'));
          const ids=new Set(a.map(x=>x.id));
          assert.equal(a.length,385);assert.equal(ids.size,385);
          for(const n of a.filter(n=>n.type==='function'))try{new Function(n.func)}
          catch(e){throw Error(n.name+' ['+n.id+']: '+e.message)}
          for(let i=1;i<=3;i++){
            const mqtt=a.find(n=>n.id==='espqueue'+i+'_mqtt_out');
            assert.equal(mqtt.broker,'be91b725157afee1');
            const queue=a.find(n=>n.id==='espqueue'+i+'_control');
            assert(queue.func.includes('global.set(KEY,q,"persistent")'));
          }
          console.log('All functions and ESP-only queue wiring compile');
          NODE
      - name: Commit canonical flows.json to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-voltronic/flows.json
          if git diff --cached --quiet; then echo 'Canonical flow already materialized'; exit 0; fi
          git commit -m 'feat(esp32): persistent 5-slot hourly verified command queue and HA purge button'
          git pull --rebase origin main
          git push origin HEAD:main
