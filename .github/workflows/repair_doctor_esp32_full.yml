name: Voltronic Doctor ESP32 full night/reliability regression
on:
  push:
    branches: [main]
    paths:
      - 'smart-voltronic/tests/repair_doctor_esp32_full.py'
      - 'smart-voltronic/tests/test_doctor_esp32_night_full.cjs'
      - 'smart-voltronic/tests/test-canonical-esp32-doctor.cjs'
      - '.github/workflows/repair_doctor_esp32_full.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Patch canonical 385-node flow and simulate day-night-switch-wake-offline
        run: node smart-voltronic/tests/test_doctor_esp32_night_full.cjs
      - name: Verify prior parser, learning, HA IDs and ESP health behavior
        run: |
          node smart-voltronic/tests/test-canonical-esp32-doctor.cjs
          node smart-voltronic/tests/test-main-esp32-parser.cjs
          node smart-voltronic/tests/test-esp32-parse-options.cjs
          bash -n smart-voltronic/run.sh
      - name: Lint all JavaScript function nodes and Doctor dashboard
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const nodes=JSON.parse(fs.readFileSync('smart-voltronic/flows.json','utf8'));
          assert.strictEqual(nodes.length,385);
          for(const n of nodes.filter(n=>n.type==='function')){
            try{new Function(n.func)}catch(e){throw Error('Syntax '+n.id+' '+n.name+': '+e.message)}
          }
          const m=new Map(nodes.map(n=>[n.id,n]));
          for(let i=1;i<=3;i++)assert(m.get(['3ea573730416012d','7e96e2b785b1d159','638cb89fdbee6fe3'][i-1]).func.includes('ESP_DOCTOR_NIGHT_REPAIRED_INV'+i));
          console.log('PASS: all original and integrated Node-RED functions compile');
          JS
      - name: Publish repaired full flows.json with existing 355 IDs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-voltronic/flows.json
          if git diff --cached --quiet; then
            echo 'Canonical flow already current'
            exit 0
          fi
          git commit -m "fix(doctor): restore ESP night toggle and freeze; suppress orphan false alarms"
          git pull --rebase origin main
          git push origin HEAD:main
