name: Inspect ESP Doctor telemetry source contract
on:
  push:
    branches: [main]
    paths: ['smart-voltronic/tests/inspect_esp_network_contract.cjs','.github/workflows/inspect_esp_network_contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node smart-voltronic/tests/inspect_esp_network_contract.cjs
