name: ESP32 canonical flow compatibility
on:
  push:
    branches: [main, refactor/canonical-nodered-flow]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node smart-voltronic/tests/test-canonical-esp32-doctor.cjs
      - run: node smart-voltronic/tests/test-main-esp32-parser.cjs
      - run: node smart-voltronic/tests/test-esp32-parse-options.cjs
      - run: bash -n smart-voltronic/run.sh
