name: ESP Doctor WiFi HTTP RS232 diagnostics full-flow tests
on:
  push:
    branches: [main]
    paths:
      - 'smart-voltronic/tests/integrate_esp_network_diagnostics.py'
      - 'smart-voltronic/tests/test_esp_network_diagnostics.cjs'
      - '.github/workflows/integrate_esp_network_diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  network-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Integrate into canonical 355-node flow and test WiFi / HTTP / UART
        run: node smart-voltronic/tests/test_esp_network_diagnostics.cjs
      - name: Confirm syntax of complete 373-node Node-RED flow, MQTT identity and offline handling
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const a=JSON.parse(fs.readFileSync('smart-voltronic/flows.json','utf8'));assert.equal(a.length,373);
          const m=new Map(a.map(n=>[n.id,n]));assert.equal(m.size,373);
          for(const n of a.filter(n=>n.type==='function'))try{new Function(n.func)}catch(e){throw Error(n.id+' '+n.name+': '+e.message)}
          for(let i=1;i<=3;i++){
            assert.deepEqual(m.get('espnet'+i+'_tick').wires,[['espnet'+i+'_builder']]);
            assert.deepEqual(m.get('espnet'+i+'_http').wires,[['espnet'+i+'_collect']]);
            assert.equal(m.get('espnet'+i+'_collect').wires[0].length,0);
            assert(m.get('espnet'+i+'_collect').func.includes('wifi_disconnect_count'));
          }
          console.log('PASS: all 373 nodes compile, no extra UART commands');
          NODE
      - name: Preserve previous code and commit maintained canonical flow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-voltronic/flows.json
          if git diff --cached --quiet; then
            echo 'Flow already integrated'
            exit 0
          fi
          git commit -m 'feat(doctor): WiFi, HTTP outages and RS232 counters for ESP1/2/3'
          git pull --rebase origin main
          git push origin HEAD:main
