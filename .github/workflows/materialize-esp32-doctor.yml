name: Materialize ESP32 Doctor into canonical flows.json
on:
  push:
    branches: [main]
    paths:
      - 'smart-voltronic/tests/materialize_esp32_doctor.py'
      - '.github/workflows/materialize-esp32-doctor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Build complete canonical flows.json from existing main (no ID rename)
        run: python3 smart-voltronic/tests/materialize_esp32_doctor.py
      - name: Verify Doctor/ESP code, UI wiring and MQTT identities
        run: |
          node - <<'NODE'
          const assert=require('assert'),fs=require('fs');
          const nodes=JSON.parse(fs.readFileSync('smart-voltronic/flows.json'));
          assert.strictEqual(nodes.length,355);
          const m=new Map(nodes.map(n=>[n.id,n]));
          for(const id of ['3ea573730416012d','7e96e2b785b1d159','638cb89fdbee6fe3','2978c86114a84875','8a05fbc3b3f6bdbc','d34cc22c5de4c537','2d7f7336b88783dc']) {
            assert(m.get(id).func.includes('ESP_DOCTOR_') || m.get(id).func.includes('ESP32 : liaison RS232 via Wi-Fi'));
            new Function(m.get(id).func);
          }
          for(let i=1;i<=3;i++){
            for(const kind of ['tick','builder','http','replay','status','learn']) assert(m.has('espfull'+i+'_'+kind));
            assert(m.get('espfull'+i+'_replay').func.includes('inv"+i+"_esp_health'.replace('"+i+"',String(i))) || m.get('espfull'+i+'_replay').func.includes('esp_health'));
          }
          console.log('Node-RED ESP + Doctor 355 nodes syntax validated');
          NODE
      - name: Commit fully maintained flow as versioned source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-voltronic/flows.json
          if git diff --cached --quiet; then
            echo "Canonical flows already current"
            exit 0
          fi
          git commit -m 'feat(flows): canonical 355 nodes including ESP1/2/3 and Doctor'
          git pull --rebase origin main
          git push origin HEAD:main
