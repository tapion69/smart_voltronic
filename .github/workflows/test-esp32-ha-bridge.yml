name: ESP32 to Smart Voltronic bridge regression

on:
  push:
    branches:
      - test/esp32-ha-bridge
      - dev/esp32-s3-full-live-test
    paths:
      - 'smart-voltronic/**'
      - '.github/workflows/test-esp32-ha-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node-RED flow and cache adapter tests
        run: node --test smart-voltronic/tests/esp32-ha-bridge.test.cjs
      - name: Add-on shell startup syntax
        run: bash -n smart-voltronic/run.sh
      - name: Confirm three allowed transport choices
        run: |
          grep -q 'list(serial|gateway|esp32)' smart-voltronic/config.yaml
          grep -q 'esp32)' smart-voltronic/run.sh
          grep -Fq 'INV${n}_ESP_WRITE_ENABLED' smart-voltronic/run.sh
          grep -q 'espfull1_learn' smart-voltronic/esp32_learning_nodes.json
