name: Inspect main 2.3.7 ESP integration compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-main-esp.yml','smart-voltronic/tests/inspect-main-esp.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node smart-voltronic/tests/inspect-main-esp.cjs
