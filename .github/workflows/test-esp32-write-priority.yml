name: Test ESP32 priority verified writes
on:
  push:
    branches: ['fix/esp32-priority-verified-write-20261122']
    paths:
      - 'smart-voltronic/esp32_write_priority_patch.cjs'
      - 'smart-voltronic/run.sh'
      - 'smart-voltronic/tests/test_esp32_write_priority.cjs'
      - '.github/workflows/test-esp32-write-priority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test full 385-node flow priority with synthetic HA requests
        run: node smart-voltronic/tests/test_esp32_write_priority.cjs
      - name: Ensure shell startup is valid
        run: bash -n smart-voltronic/run.sh
      - name: ESP bridge existing regression tests
        run: |
          node smart-voltronic/tests/test-main-esp32-parser.cjs
          node smart-voltronic/tests/test-esp32-parse-options.cjs
